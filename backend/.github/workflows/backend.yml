name: Backend Build

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x mvnw

      - run: ./mvnw clean package